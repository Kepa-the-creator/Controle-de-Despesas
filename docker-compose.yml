services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_POCKETBASE_URL: ${PUBLIC_POCKETBASE_URL}
    restart: unless-stopped

  pocketbase:
    build:
      context: ./pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.28.2}
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data

  # Só é iniciado com `docker compose --profile https up -d`, depois que o
  # domínio estiver configurado (ver DEPLOY.md, fase 2).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - FRONTEND_HOST=${FRONTEND_HOST}
      - PB_HOST=${PB_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - pocketbase

volumes:
  pb_data:
  caddy_data:
  caddy_config:
